name: Deploy Cotizar Proyecto

on:
  push:
    branches:
      - desarrollo/arquitectos-constructoras
    paths:
      - 'website/cotizar-proyecto/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

concurrency:
  group: deploy-cotizar-proyecto
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar paquete aislado
        run: |
          rm -rf deploy-cotizar
          mkdir -p deploy-cotizar
          cp -a website/cotizar-proyecto/. deploy-cotizar/

      - name: Deploy solo Cotizar Proyecto
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy-cotizar/
          server-dir: /public_html/cotizar-proyecto/
          state-name: .ftp-deploy-cotizar-state.json
          exclude: |
            **/.git*
            **/.git*/**
